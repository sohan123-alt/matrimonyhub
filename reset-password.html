<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/pages/auth.css">
<title>Choose a new password | MatrimonyHub</title>
<meta name="robots" content="noindex">
</head>
<body>
<div class="auth">
  <aside class="auth-aside">
    <a href="index.html" class="logo"><span class="logo-mark"><i class="fas fa-heart"></i></span>MatrimonyHub</a>
    <div class="aside-body"><h2>Almost back in.</h2><p>Pick a strong password you have not used anywhere else.</p></div>
    <div class="aside-foot">&copy; 2026 MatrimonyHub</div>
  </aside>
  <main class="auth-main"><div class="auth-box">
      <h1>New password</h1>
      <p>Choose a password with at least 8 characters.</p>
      <div id="waiting" style="text-align:center;padding:2rem 0"><i class="fas fa-circle-notch spin" style="font-size:1.6rem;color:var(--purple)"></i><p style="margin-top:.8rem">Checking your link...</p></div>
      <div id="invalid" hidden>
        <div class="alert alert-error show"><i class="fas fa-circle-exclamation"></i><span>This reset link is invalid or has expired.</span></div>
        <a href="forgot-password.html" class="btn btn-primary btn-block">Get a new link</a>
      </div>
      <div class="alert" id="alert" role="alert"><i class="fas fa-circle-exclamation"></i><span></span></div>
      <form id="resetForm" novalidate hidden>
        <div class="field"><label for="password">New password</label><div class="input-wrap"><i class="fas fa-lock lead"></i><input class="input" type="password" id="password" name="password" autocomplete="new-password" required><button type="button" class="toggle-pass" data-target="password" aria-label="Show password"><i class="fas fa-eye"></i></button></div></div>
        <div class="field"><label for="confirm">Confirm password</label><div class="input-wrap"><i class="fas fa-shield-halved lead"></i><input class="input" type="password" id="confirm" name="confirm" autocomplete="new-password" required><button type="button" class="toggle-pass" data-target="confirm" aria-label="Show password"><i class="fas fa-eye"></i></button></div></div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg btn-block"><i class="fas fa-check"></i> Update password</button>
      </form></div></main>
</div>
<script type="module" src="assets/js/pages/reset-password.js"></script>
</body>
</html>
