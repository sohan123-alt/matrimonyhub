<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/pages/auth.css">
<title>Forgot password | MatrimonyHub</title>
<meta name="robots" content="noindex">
</head>
<body>
<div class="auth">
  <aside class="auth-aside">
    <a href="index.html" class="logo"><span class="logo-mark"><i class="fas fa-heart"></i></span>MatrimonyHub</a>
    <div class="aside-body"><h2>Locked out? It happens.</h2><p>Enter your email and we will send you a link to choose a new password.</p></div>
    <div class="aside-foot">&copy; 2026 MatrimonyHub</div>
  </aside>
  <main class="auth-main"><div class="auth-box">
      <a href="login.html" class="back"><i class="fas fa-arrow-left"></i> Back to log in</a>
      <h1>Reset password</h1>
      <p>We will email you a reset link.</p>
      <div class="alert" id="alert" role="alert"><i class="fas fa-circle-exclamation"></i><span></span></div>
      <form id="forgotForm" novalidate>
        <div class="field"><label for="email">Email</label><div class="input-wrap"><i class="fas fa-envelope lead"></i><input class="input" type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required></div></div>
        <button type="submit" id="submitBtn" class="btn btn-primary btn-lg btn-block"><i class="fas fa-paper-plane"></i> Send reset link</button>
      </form>
      <div id="sent" hidden>
        <div class="alert alert-success show" style="margin-bottom:1.4rem"><i class="fas fa-circle-check"></i><span>If an account exists for <b id="sentEmail"></b>, a reset link is on its way. Check your spam folder too.</span></div>
        <a href="login.html" class="btn btn-outline btn-block">Back to log in</a>
      </div></div></main>
</div>
<script type="module" src="assets/js/pages/forgot-password.js"></script>
</body>
</html>
