<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/pages/app.css">
<link rel="stylesheet" href="../../assets/css/pages/admin.css">
<title>Users | MatrimonyHub</title>
</head>
<body class="app">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <div class="toolbar">
        <div class="search"><i class="fas fa-magnifying-glass"></i><input class="input" id="q" placeholder="Search name or email" aria-label="Search users"></div>
        <select class="select sm" id="roleF" aria-label="Filter by role"><option value="">All roles</option><option>USER</option><option>STAFF</option><option>ADMIN</option></select>
        <span class="muted" id="count" style="margin-left:auto;color:var(--ink-soft);font-size:.88rem"></span>
      </div>
      <div class="panel table-wrap"><table class="tbl"><thead><tr><th>User</th><th>Role</th><th>Status</th><th>Joined</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="5"><div class="skel" style="height:120px"></div></td></tr></tbody></table></div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<script type="module" src="../../assets/js/pages/admin-users.js"></script>
</body>
</html>
