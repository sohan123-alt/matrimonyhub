<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/pages/app.css">
<link rel="stylesheet" href="../../assets/css/pages/admin.css">
<title>Profiles | MatrimonyHub</title>
</head>
<body class="app">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <div class="toolbar">
        <div class="search"><i class="fas fa-magnifying-glass"></i><input class="input" id="q" placeholder="Search name or city" aria-label="Search profiles"></div>
        <div class="tabs" id="tabs"><button class="on" data-t="all">All<small>0</small></button><button data-t="unverified">Unverified<small>0</small></button><button data-t="verified">Verified<small>0</small></button><button data-t="premium">Premium<small>0</small></button></div>
      </div>
      <div class="panel table-wrap"><table class="tbl"><thead><tr><th>Member</th><th>Location</th><th>Verification</th><th>Plan</th><th>Created</th><th>Actions</th></tr></thead><tbody id="rows"><tr><td colspan="6"><div class="skel" style="height:120px"></div></td></tr></tbody></table></div>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>

<script type="module" src="../../assets/js/pages/admin-profiles.js"></script>
</body>
</html>
