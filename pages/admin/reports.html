<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../../assets/img/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/variables.css">
<link rel="stylesheet" href="../../assets/css/base.css">
<link rel="stylesheet" href="../../assets/css/components.css">
<link rel="stylesheet" href="../../assets/css/layout.css">
<link rel="stylesheet" href="../../assets/css/pages/app.css">
<link rel="stylesheet" href="../../assets/css/pages/admin.css">
<title>Reports | MatrimonyHub</title>
</head>
<body class="app">
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="content" id="content">

      <div class="toolbar no-print">
        <button class="btn btn-primary btn-sm" id="saveBtn"><i class="fas fa-floppy-disk"></i> Save snapshot</button>
        <button class="btn btn-outline btn-sm" id="csvBtn"><i class="fas fa-file-csv"></i> Export payments CSV</button>
        <button class="btn btn-outline btn-sm" id="printBtn"><i class="fas fa-print"></i> Print</button>
      </div>
      <div class="stats" id="stats"><div class="skel" style="height:84px"></div><div class="skel" style="height:84px"></div><div class="skel" style="height:84px"></div></div>
      <div class="chart-grid">
        <section class="panel"><h2>Revenue, last 6 months</h2><div class="chart-box"><canvas id="cRev"></canvas></div></section>
        <section class="panel"><h2>Verification</h2><div class="chart-box"><canvas id="cVer"></canvas></div></section>
      </div>
      <div class="chart-grid" style="grid-template-columns:1fr 1.6fr">
        <section class="panel"><h2>Membership</h2><div class="chart-box"><canvas id="cMem"></canvas></div></section>
        <section class="panel"><h2>Profiles by religion</h2><div class="chart-box"><canvas id="cRel"></canvas></div></section>
      </div>
      <section class="panel table-wrap"><h2>Saved snapshots</h2><table class="tbl"><thead><tr><th>Date</th><th>Profiles</th><th>Verified</th><th>Pending</th><th>Paid</th><th>Unpaid</th></tr></thead><tbody id="history"></tbody></table></section>
    </main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module" src="../../assets/js/pages/admin-reports.js"></script>
</body>
</html>
